stages:
  - deploy

variables:
  DEPLOY_PATH: "/opt/portfolio"
  DEPLOY_USER: "nicolas"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p ${SSH_PORT:-22} "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - rsync -rzv --delete
      --exclude='.git'
      --exclude='node_modules'
      --exclude='.next'
      -e "ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new"
      ./
      ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
    - ssh -p ${SSH_PORT:-22} ${DEPLOY_USER}@${DEPLOY_HOST}
      "cd ${DEPLOY_PATH} && docker compose up -d --build"
  only:
    - master
  environment:
    name: production
    url: https://ndcorder.me
